---
- name: playbook for vlan
  hosts: all

  tasks:
    - name: Configure access vlan
      junipernetworks.junos.junos_vlans:
        config:
          - name: "{{ item.name }}"
            vlan_id: "{{ item.id }}"
      loop: "{{ VLANS }}"

    - name: Make ports routed
      junipernetworks.junos.junos_config:
        lines:
          - "delete interfaces {{ item.name }} unit 0 family ethernet-switching"
          - "set interfaces {{ item.name }} unit 0 family inet address {{ item.ip }}"
      loop: "{{ interfaces }}"

    - name: Configure trunk port
      junipernetworks.junos.junos_l2_interfaces:
        config:
          - name: xe-0/0/0
            trunk:
              native_vlan: 99
              allowed_vlans: "{{ VLANS | map(attribute='id') | list }}"

    - name: Configure access ports
      junipernetworks.junos.junos_l2_interfaces:
        config:
          - access:
            vlan: "{{ item.id }}"
            enhanced_layer: true
            name: "{{ item.interface }}"
        loop: "{{ VLANS }}"

    - name: Fetch VLAN configuration
      junipernetworks.junos.junos_command:
        commands:
          - show vlan
      register: vlan_result

    - name: Print VLAN result
      debug:
        var: vlan_result